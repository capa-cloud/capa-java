name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }} / Logback ${{ matrix.logback }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            logback: "1.3.16"
          - java: "11"
            logback: "1.3.16"
          - java: "11"
            logback: "1.5.38"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: >-
          mvn --batch-mode --no-transfer-progress --fail-fast clean verify
          -Pjacoco,rat,checkstyle
          -DskipTests=false
          -Dcheckstyle.skip=false
          -Drat.skip=false
          -Dlogback.version=${{ matrix.logback }}
          -Dmaven.javadoc.skip=true
          -Dgpg.skip=true
